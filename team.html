<!DOCTYPE html>
<html lang="et"> <!-- Mis keeles dokument on -->
<head>
    <meta charset="UTF-8">
    <title>Tiim</title> <!-- Veebilehe pealkiri, mida näidatakse brauseri tab-is -->
    <link rel="stylesheet" type="text/css" href="main.css"/> <!-- Ühendus üldise css ja meie lehe vahel -->
    <link rel="stylesheet" type="text/css" href="stylesheets/team.css"/>
    <!-- Ühendus lehekülje css ja meie lehe vahel -->
</head>
<body>

<!-- Navigatsioonirida, millega navigeeritakse lehekülgede vahel -->

<div id="navbar">
    <ul>
        <li><a class="nav-bar" href="index.html"> Avaleht </a></li>
        <li style="float: right"><a class="nav-bar" href="team.html"> Tiim </a></li>
        <li style="float: right"><a class="nav-bar" href="nelijarve.html"> Nelijärve bingo </a></li>
    </ul>
</div>

<!-- Tiimi nimi -->

<h1 style="align-self: flex-start"> Tiimi nimi</h1>

<!-- Tiimiliikmete kaardid -->

<div class="container">

    <!-- Esimese tiimiliikme kaart -->

    <div class="card">

        <img src="images/question.png"/> <!-- Tiimiliikme discordi pilt -->
        <h1 style="align-self: flex-start"> Tiimiliige 1 </h1> <!-- Tiimiliikme kasutajanimi discordis -->
        <p style="align-self: flex-start"> Roll tiimis </p> <!-- Mida tiimiliige töötoas tegi -->

        <div class="overlay"> <!-- Kui klikkida tiimiliikme kaardi peale, siis tuleb ette järgnev overlay -->

            <div class="overlay-content">
                <img class="close-icon" src="images/close.png"/> <!-- Pilt, mille vajutamisega läheb vaade kinni -->
                <div class="pictures-and-text">
                    <div class="teammates-picture">
                        <img style="max-height: 30vw; max-width: 20vw" src="images/img.png"> <!-- Pilt tiimiliikmest -->
                    </div>
                    <div>
                        <h1> eesnimi perekonnanimi </h1> <!-- Tiimiliikme ees- ja perekonnanimi -->
                        <p> Olen rühmas 1X </p> <!-- tiimiliikme rühm -->
                        <p class="fact true"> fakt </p> <!-- Tõene fakt tiimiliikme kohta -->
                        <p class="fact false"> fakt</p> <!-- Väär fakt tiimiliikme kohta -->
                        <p class="fact true"> fakt </p> <!-- Tõene fakt tiimiliikme kohta -->
                    </div>
                </div>
            </div>

        </div>

    </div>

    <div class="card">
        <!-- Tee see osa ise! -->
    </div>
    <div class="card">
        <!-- Tee see osa ise! -->
    </div>
</div>
<div class="container">

</div>
<script>
    // Lehe funktsionaalsuse lisamiseks lisame sellise javascripti koodi.

    // Tiimiliikme kaardile klikkimisel avaneb uus vaade

    const cards = document.querySelectorAll('.card'); // kogume kokku kõik elemendid, mille klass on card

    // iga kaardi kohta lisame funktsionaalsuse
    cards.forEach(function (card) {

        // kui vajutame kaardile, siis näitame uut vaadet
        card.addEventListener('click', function () {
            card.classList.add('active');
        });

        // Uue vaate kinni panemise funktsionaalsus
        const closeButton = card.querySelector('.close-icon');
        if (closeButton) {
            closeButton.addEventListener('click', function (event) {
                event.stopPropagation();
                card.classList.remove('active');
            });
        }
    });

    // Faktide punaseks ja roheliseks värvimine

    const facts = document.querySelectorAll('.fact');
    facts.forEach(function (fact) {
        fact.addEventListener('click', function () {
            // kui elemendi klassi järel on fact true, siis teeb roheliseks, kui false, siis punaseks
            if (fact.classList.contains('true')) {
                fact.style.color = "green";
            } else if (fact.classList.contains('false')) {
                fact.style.color = "red";
            }
        })
    })

</script>
</body>
</html>
